name: Test standalone Fincept research MCP and publish GHCR
on:
  push:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cloud9-fincept-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Privacy, five tool contract, diagrams
        run: python3 tests/privacy.py
      - uses: docker/setup-buildx-action@v3
      - name: Build independently maintained adapter with current compatible SDK
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: local/cloud9-fincept-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Offline financial expression safety plus actual five-tool HTTP protocol and input-schema parity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$PWD/tests:/contract:ro" \
            -e MCP_ALLOWED_HOSTS=127.0.0.1:18765 \
            --entrypoint sh local/cloud9-fincept-mcp:test /contract/live_canary.sh
  publish:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/godsquantum/cloud9-fincept-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/GodsQuantum/Cloud9-Fincept-MCP
            org.opencontainers.image.title=Cloud9-Fincept-MCP
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
